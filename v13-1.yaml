proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - PROXY
      - DIRECT

  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 💬 AI 服务
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🍏 苹果服务
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🌐 代理通用
    type: select
    proxies:
      - 🚀 节点选择
      - DIRECT

  - name: 🔒 国内直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

